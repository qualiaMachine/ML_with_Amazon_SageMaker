<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="Helvetica, Arial, sans-serif" font-size="16">
  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-weight="bold" font-size="22">What one fine-tuning run costs (log scale)</text>
  <text x="500" y="58" text-anchor="middle" font-size="15" fill="#555">SageMaker on-demand, us-east-1, October 2026. Lighter extension: the same run repeated in a 10-run hyperparameter sweep.</text>

  <line x1="330" y1="460" x2="960" y2="460" stroke="#444"/>
  <g font-size="14" text-anchor="middle" fill="#333">
    <line x1="330" y1="460" x2="330" y2="466" stroke="#444"/><text x="330" y="484">$0.10</text>
    <line x1="420" y1="460" x2="420" y2="466" stroke="#444"/><text x="420" y="484">$1</text>
    <line x1="510" y1="460" x2="510" y2="466" stroke="#444"/><text x="510" y="484">$10</text>
    <line x1="600" y1="460" x2="600" y2="466" stroke="#444"/><text x="600" y="484">$100</text>
    <line x1="690" y1="460" x2="690" y2="466" stroke="#444"/><text x="690" y="484">$1,000</text>
    <line x1="780" y1="460" x2="780" y2="466" stroke="#444"/><text x="780" y="484">$10,000</text>
    <line x1="870" y1="460" x2="870" y2="466" stroke="#444"/><text x="870" y="484">$100,000</text>
    <line x1="960" y1="460" x2="960" y2="466" stroke="#444"/><text x="960" y="484">$1 M</text>
  </g>
  <g stroke="#eee">
    <line x1="420" y1="80" x2="420" y2="460"/><line x1="510" y1="80" x2="510" y2="460"/><line x1="600" y1="80" x2="600" y2="460"/>
    <line x1="690" y1="80" x2="690" y2="460"/><line x1="780" y1="80" x2="780" y2="460"/><line x1="870" y1="80" x2="870" y2="460"/>
  </g>

  <!-- x_end = 420 + 90*log10(cost); sweep bar = +90; rows 46 px apart from y=88 -->
  <text x="315" y="105" text-anchor="end" font-weight="bold">This episode: 3B LoRA, 120 pages</text>
  <rect x="330" y="88" width="160" height="24" fill="#fdd0a2"/>
  <rect x="330" y="88" width="70" height="24" fill="#2b8cbe" stroke="#444"/>
  <text x="495" y="106" font-weight="bold">$0.60</text>

  <text x="315" y="151" text-anchor="end">Homework: 3B LoRA, 251 pages</text>
  <rect x="330" y="134" width="182" height="24" fill="#fdd0a2"/>
  <rect x="330" y="134" width="92" height="24" fill="#2b8cbe" stroke="#444"/>
  <text x="517" y="152">$1.05</text>

  <text x="315" y="197" text-anchor="end">Estimate: 3B LoRA, 619 pages</text>
  <rect x="330" y="180" width="212" height="24" fill="#fdd0a2"/>
  <rect x="330" y="180" width="122" height="24" fill="#2b8cbe" stroke="#444" stroke-dasharray="4 3"/>
  <text x="547" y="198">$2.25</text>

  <text x="315" y="243" text-anchor="end">7B full fine-tune, 50k docs</text>
  <rect x="330" y="226" width="373" height="24" fill="#fdd0a2"/>
  <rect x="330" y="226" width="283" height="24" fill="#e6550d" stroke="#444"/>
  <text x="708" y="244" font-weight="bold">$140</text>

  <text x="315" y="289" text-anchor="end">70B LoRA, one day</text>
  <rect x="330" y="272" width="430" height="24" fill="#fdd0a2"/>
  <rect x="330" y="272" width="340" height="24" fill="#e6550d" stroke="#444"/>
  <text x="765" y="290" font-weight="bold">$600</text>

  <text x="315" y="335" text-anchor="end">CHURRO-3B's own training</text>
  <rect x="330" y="318" width="522" height="24" fill="#fdd0a2"/>
  <rect x="330" y="318" width="432" height="24" fill="#a50f15" stroke="#444"/>
  <text x="857" y="336" font-weight="bold">$6,300</text>

  <text x="315" y="381" text-anchor="end">70B full fine-tune, two days</text>
  <rect x="330" y="364" width="547" height="24" fill="#fdd0a2"/>
  <rect x="330" y="364" width="457" height="24" fill="#a50f15" stroke="#444"/>
  <text x="882" y="382" font-weight="bold">$12,000</text>

  <text x="500" y="525" text-anchor="middle" font-size="15" fill="#333">Each grid line is 10×; a sweep moves every bar one decade right. Dashed bar: estimated, not run.</text>
</svg>
