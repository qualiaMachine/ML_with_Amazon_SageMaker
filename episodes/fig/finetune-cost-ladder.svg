<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="Helvetica, Arial, sans-serif" font-size="16">
  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-weight="bold" font-size="22">What one fine-tuning run costs (log scale)</text>
  <text x="500" y="58" text-anchor="middle" font-size="15" fill="#555">SageMaker on-demand, us-east-1, October 2026. Lighter extension: the same run repeated in a 10-run hyperparameter sweep.</text>
  <line x1="330" y1="460" x2="960" y2="460" stroke="#444"/>
  <g font-size="14" text-anchor="middle" fill="#333">
    <line x1="330" y1="460" x2="330" y2="466" stroke="#444"/><text x="330" y="484">$0.10</text>
    <line x1="420" y1="460" x2="420" y2="466" stroke="#444"/><text x="420" y="484">$1</text>
    <line x1="510" y1="460" x2="510" y2="466" stroke="#444"/><text x="510" y="484">$10</text>
    <line x1="600" y1="460" x2="600" y2="466" stroke="#444"/><text x="600" y="484">$100</text>
    <line x1="690" y1="460" x2="690" y2="466" stroke="#444"/><text x="690" y="484">$1,000</text>
    <line x1="780" y1="460" x2="780" y2="466" stroke="#444"/><text x="780" y="484">$10,000</text>
    <line x1="870" y1="460" x2="870" y2="466" stroke="#444"/><text x="870" y="484">$100,000</text>
    <line x1="960" y1="460" x2="960" y2="466" stroke="#444"/><text x="960" y="484">$1 M</text>
    </g>
  <g stroke="#eee"><line x1="420" y1="80" x2="420" y2="460"/><line x1="510" y1="80" x2="510" y2="460"/><line x1="600" y1="80" x2="600" y2="460"/><line x1="690" y1="80" x2="690" y2="460"/><line x1="780" y1="80" x2="780" y2="460"/><line x1="870" y1="80" x2="870" y2="460"/></g>
  <text x="315" y="117" text-anchor="end" font-weight="bold">This episode: 3B LoRA, 120 pages, 2 passes</text>
  <rect x="330" y="100" width="160" height="24" fill="#fdd0a2"/>
  <rect x="330" y="100" width="70" height="24" fill="#2b8cbe" stroke="#444"/>
  <text x="495" y="118" font-weight="bold">$0.60</text>
  <text x="315" y="167" text-anchor="end">Homework: 3B LoRA, 619 pages, 2 passes</text>
  <rect x="330" y="150" width="212" height="24" fill="#fdd0a2"/>
  <rect x="330" y="150" width="122" height="24" fill="#2b8cbe" stroke="#444" stroke-dasharray="4 3"/>
  <text x="547" y="168">$2.25</text>
  <text x="315" y="217" text-anchor="end">7B full fine-tune, 50k docs, 3 passes</text>
  <rect x="330" y="200" width="373" height="24" fill="#fdd0a2"/>
  <rect x="330" y="200" width="283" height="24" fill="#e6550d" stroke="#444"/>
  <text x="708" y="218" font-weight="bold">$140</text>
  <text x="315" y="267" text-anchor="end">70B LoRA, one day</text>
  <rect x="330" y="250" width="430" height="24" fill="#fdd0a2"/>
  <rect x="330" y="250" width="340" height="24" fill="#e6550d" stroke="#444"/>
  <text x="765" y="268" font-weight="bold">$600</text>
  <text x="315" y="317" text-anchor="end">CHURRO-3B's own training</text>
  <rect x="330" y="300" width="522" height="24" fill="#fdd0a2"/>
  <rect x="330" y="300" width="432" height="24" fill="#a50f15" stroke="#444"/>
  <text x="857" y="318" font-weight="bold">$6,300</text>
  <text x="315" y="367" text-anchor="end">70B full fine-tune, two days</text>
  <rect x="330" y="350" width="547" height="24" fill="#fdd0a2"/>
  <rect x="330" y="350" width="457" height="24" fill="#a50f15" stroke="#444"/>
  <text x="882" y="368" font-weight="bold">$12,000</text>
  <text x="500" y="508" text-anchor="middle" font-size="15" fill="#333">Each grid line is 10×; a sweep moves every bar one decade right. Dashed bar: estimated, not run.</text>
  <text x="500" y="530" text-anchor="middle" font-size="15" fill="#333">Passes over the data are the class budget, not a norm: large corpora usually get 1 to 3, a few hundred examples 5 to 10. Each extra pass adds the same again.</text>
</svg>
