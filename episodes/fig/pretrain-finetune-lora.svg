<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="Helvetica, Arial, sans-serif" font-size="16">
<rect width="1200" height="440" fill="#ffffff"/>
<text x="600" y="34" text-anchor="middle" font-weight="bold" font-size="22">GPU-hours to get a 3B model that does a task, on a log scale</text>
<rect x="380" y="52" width="18" height="18" fill="#fdae6b" stroke="#444"/><text x="404" y="66" font-size="14">weights trained</text>
<rect x="540" y="52" width="18" height="18" fill="#9ecae1" stroke="#444"/><text x="564" y="66" font-size="14">weights frozen</text>
<line x1="170" y1="360" x2="1060" y2="360" stroke="#444" stroke-width="1.5"/>
<line x1="170" y1="360" x2="170" y2="366" stroke="#444"/>
<text x="170" y="384" text-anchor="middle" font-size="13">0.1</text>
<line x1="281" y1="360" x2="281" y2="366" stroke="#444"/>
<text x="281" y="384" text-anchor="middle" font-size="13">1</text>
<line x1="281" y1="90" x2="281" y2="360" stroke="#eee"/>
<line x1="392" y1="360" x2="392" y2="366" stroke="#444"/>
<text x="392" y="384" text-anchor="middle" font-size="13">10</text>
<line x1="392" y1="90" x2="392" y2="360" stroke="#eee"/>
<line x1="504" y1="360" x2="504" y2="366" stroke="#444"/>
<text x="504" y="384" text-anchor="middle" font-size="13">100</text>
<line x1="504" y1="90" x2="504" y2="360" stroke="#eee"/>
<line x1="615" y1="360" x2="615" y2="366" stroke="#444"/>
<text x="615" y="384" text-anchor="middle" font-size="13">1,000</text>
<line x1="615" y1="90" x2="615" y2="360" stroke="#eee"/>
<line x1="726" y1="360" x2="726" y2="366" stroke="#444"/>
<text x="726" y="384" text-anchor="middle" font-size="13">10,000</text>
<line x1="726" y1="90" x2="726" y2="360" stroke="#eee"/>
<line x1="838" y1="360" x2="838" y2="366" stroke="#444"/>
<text x="838" y="384" text-anchor="middle" font-size="13">100,000</text>
<line x1="838" y1="90" x2="838" y2="360" stroke="#eee"/>
<line x1="949" y1="360" x2="949" y2="366" stroke="#444"/>
<text x="949" y="384" text-anchor="middle" font-size="13">1 million</text>
<line x1="949" y1="90" x2="949" y2="360" stroke="#eee"/>
<line x1="1060" y1="360" x2="1060" y2="366" stroke="#444"/>
<text x="1060" y="384" text-anchor="middle" font-size="13">10 million</text>
<line x1="1060" y1="90" x2="1060" y2="360" stroke="#eee"/>
<text x="615" y="406" text-anchor="middle" font-size="14">GPU-hours (each step to the right is ten times more)</text>
<rect x="40" y="104" width="44" height="30" fill="#fdae6b" stroke="#444"/>
<text x="170" y="92" font-weight="bold" font-size="17">Training from scratch</text>
<text x="395" y="92" font-size="14" fill="#555">Llama 3.2 3B, every weight from random</text>
<rect x="170" y="100" width="741" height="34" fill="#fdae6b" stroke="#444"/>
<text x="180" y="123" font-size="14">460,000 GPU-hours: about a thousand H100s for three weeks, ~300 MWh</text>
<rect x="40" y="190" width="44" height="30" fill="#fdae6b" stroke="#444"/>
<text x="170" y="178" font-weight="bold" font-size="17">Full fine-tuning</text>
<text x="395" y="178" font-size="14" fill="#555">CHURRO-3B, every weight from Qwen2.5-VL-3B</text>
<rect x="170" y="186" width="434" height="34" fill="#fdae6b" stroke="#444"/>
<text x="614" y="209" font-size="14">800 GPU-hours: eight H100s for four days, ~500 kWh</text>
<rect x="40" y="276" width="44" height="30" fill="#9ecae1" stroke="#444"/>
<rect x="87" y="276" width="4" height="30" fill="#fdae6b" stroke="#444"/>
<rect x="40" y="309" width="44" height="4" fill="#fdae6b" stroke="#444"/>
<text x="170" y="264" font-weight="bold" font-size="17">LoRA fine-tuning</text>
<text x="395" y="264" font-size="14" fill="#555">this episode, an adapter under 1% of the weights</text>
<rect x="170" y="272" width="81" height="34" fill="#fdae6b" stroke="#444"/>
<text x="261" y="295" font-size="14">0.5 GPU-hours: one A10G for 32 minutes, ~0.2 kWh</text>
<text x="170" y="430" font-size="13" fill="#555">Sources: Llama 3.2 model card (training time); CHURRO paper; this episode's job record. Energy is GPU electricity alone at the card's rated draw, so a lower bound.</text>
</svg>