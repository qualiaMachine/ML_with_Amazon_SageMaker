<text x="620.0" y="690" text-anchor="middle" font-size="16" font-style="italic">If in doubt, Bedrock: the worst case is a slightly higher per-token bill. The worst case on the right two columns is a four-figure invoice.</text>
<text x="620.0" y="716" text-anchor="middle" font-size="14" fill="#555">Processing jobs are the safe way to use a GPU: the instance terminates itself. Prices: SageMaker on-demand, October 2026.</text>
