<text x="599.5" y="450" text-anchor="middle" font-size="16">any open-weight</text><text x="599.5" y="470" text-anchor="middle" font-size="16">model you can load</text>
<rect x="734" y="424" width="245" height="60" fill="#fdefe6" stroke="#ffffff"/>
<text x="856.5" y="450" text-anchor="middle" font-size="16">any open-weight</text><text x="856.5" y="470" text-anchor="middle" font-size="16">model you can load</text>
<rect x="991" y="424" width="245" height="60" fill="#fbe9e9" stroke="#ffffff"/>
<text x="1113.5" y="450" text-anchor="middle" font-size="16">any open-weight</text><text x="1113.5" y="470" text-anchor="middle" font-size="16">model you can load</text>
